<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Alignment Slicer</title>

  <style>

    body{
      font-family: Arial;
      padding:20px;
    }

    input{
      width:100%;
      padding:8px;
      margin-top:5px;
      margin-bottom:15px;
    }

    button{
      width:100%;
      padding:10px;
      cursor:pointer;
    }

  </style>

</head>

<body>

<h2>Alignment Slicer</h2>

<label>Start chainage (m)</label>

<input
  id="start"
  type="number"
  placeholder="Ex: 4000"
/>

<label>End chainage (m)</label>

<input
  id="end"
  type="number"
  placeholder="Ex: 5000"
/>

<button id="slice">
  Add Cutting Planes
</button>

<script src="app.js"></script>

</body>
</html>
